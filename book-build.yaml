# --- 写作风格规范（Agent顶层指导） ---
# 这是全书通用的写作哲学和质量标准，各章具体内容在写作大纲中定义。
# Agent 启动时加载此配置作为写作行为的根本约束。
writing_style:
  # ==================== 叙事哲学 ====================
  # 定义"一段好的教材文字"长什么样

  narrative:
    # 视角：全知第三人称，不出现"你""我们""读者"
    perspective: "第三人称客观叙述"
    # 段落节奏：每段围绕一个核心论点展开，长度自然变化
    rhythm: "段落有明确中心句，长度10-600字自然波动，拒绝模板化'首先…其次…最后'"

  # ==================== 学术深度策略 ====================
  # 核心公式 vs 辅助公式的分级处理

  derivation:
    # 核心公式（全书写明"推导得"的公式）：完整五步链
    # ① 物理原理 —— 这个公式描述的物理现象是什么
    # ② 建模假设 —— 做了什么简化假设
    # ③ 数学代入 —— 关键代入步骤（不是全部，是"跳跃点"）
    # ④ 导出结果 —— 最终公式
    # ⑤ 参数解释 —— 式中每个符号的物理含义和单位
    core: "物理原理→建模假设→数学代入→导出结果→参数解释"
    # 辅助公式（中间推导步骤、已知公式的变体）：直接给出，不自创编号
    auxiliary: "直接给出，不自创\\tag编号"

  # ==================== 内容组织原则 ====================
  # 任何一段内容的展开逻辑

  content_flow:
    # 核心模式：问题→原理→量化→工程意义
    # 每个公式/概念的展开顺序
    section_pattern: "现象或工程问题 → 物理原理 → 定量描述（公式或数据） → 工程意义或设计启示"
    # 避免"知识陈列"——不能写成"定义→分类→特点"三部曲
    anti_pattern: "禁止纯概念罗列（如'××分为三类：第一…第二…第三…'），每一类必须有物理区别和工程场景支撑"

  # ==================== 公式的"呼吸" ====================
  # 公式不是孤立的，前后必须有文字

  formula_lifecycle:
    rule: "每个编号公式前有引文（说明为什么要引入这个公式），后有解读（公式的工程含义或数值感受）"
    bad: "直接写'插入损耗为：'然后丢一个公式"
    good: "先说明场景'考虑源阻抗与负载阻抗均为50Ω的匹配情况'，再给公式，然后解读'上式表明IL随频率升高而增大…'"

  # ==================== 表格和对比 ====================
  # 表格的"灵魂"在于比较维度

  table:
    purpose: "每个表格必须有明确的比较/分类/总结目的，标题应体现比较维度"
    bad: "'不同类型滤波器的对比'（太泛）"
    good: "'四种反射式滤波器的源阻抗与负载阻抗适配关系'（点明比较维度）"
    caption: "**表章-序号：标题**"
    format: "每表必含对齐标记（:--  :--:  --:）"

  # ==================== 图和Mermaid ====================
  figure:
    mermaid: "所有结构图/流程图/分类图均用Mermaid实现"
    caption: "*图章-序号：标题*"
    rule: "有图必有说明文字，说明文字不少于2行，解释图中关键元素的物理含义"

  # ==================== 案例铁律 ====================
  case:
    authenticity: "必须来自公开报道的真实事件，含公司名/时间/具体参数值"
    length: "每个案例200-800字，含技术分析（为什么发生、怎么发生的、后果、工程启示）"
    source: "禁止从参考教材（路宏敏/梁振光/张亮/柯金良）中摘抄案例"

  # ==================== 语言质量 ====================
  language:
    # 避免"口语化"和"过度书面化"两个极端
    tone: "平实准确的学术汉语，句式长短交错"
    avoid:
      - "口语化：'话又说回来'、'值得一提的是'、'需要注意的是'"
      - "过度连接：'因此'、'然而'、'此外'每段开头"
      - "模糊词：'一定程度上'、'较为'、'相当'"

  # ==================== 内容质量检查 ====================
  # 具体的公式数/例题数/表格数底线在各章写作大纲中定义
